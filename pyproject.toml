[project]
name = "vnccs-utils"
description = "VNCCS utility nodes: Pose Studio, UniCanvas, and img2threejs Studio."
version = "0.7.0"
license = {file = "LICENSE"} 

dependencies = [
    "opencv-python",
    "huggingface_hub",
    "aiohttp",
    "av",
    "kornia",
    "requests",
    "torch",
    "torchvision",
    "numpy",
    "Pillow",
    "transformers",
    "safetensors",
    "pytorch-lightning",
    "omegaconf",
    "yacs",
    "timm",
    "einops",
    "roma",
]

classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
keywords = ["comfyui", "image-processing", "3d", "pose-estimation"]

[project.urls]
Repository = "https://github.com/AHEKOT/ComfyUI_VNCCS_Utils"
#  Used by Comfy Registry https://registry.comfy.org
Documentation = "https://github.com/AHEKOT/ComfyUI_VNCCS_Utils"
"Bug Tracker" = "https://github.com/AHEKOT/ComfyUI_VNCCS_Utils/issues"

[tool.comfy]
PublisherId = "vnccs"
DisplayName = "VNCCS - Collection of utility nodes"
Icon = "https://raw.githubusercontent.com/AHEKOT/ComfyUI_VNCCS/refs/heads/main/images/VNCCS_LOGO.png"
NodeIds = [
    "VNCCS_PositionControl",
    "VNCCS_VisualPositionControl",
    "VNCCS_QWEN_Detailer",
    "VNCCS_BBox_Extractor",
    "VNCCS_ModelManager",
    "VNCCS_ModelSelector",
    "VNCCS_PoseStudio",
    "VNCCS_UniCanvas",
    "VNCCS_Img2ThreeJSStudio"
]
