name: Tests

on:
  workflow_call:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install numpy Pillow pytest pyyaml aiohttp 'dynamicprompts>=0.31,<1' 'dulwich>=1.2.20,<2'
      - name: Pack Registry archive
        run: |
          python -m pip install comfy-cli
          comfy --skip-prompt --no-enable-telemetry node pack
      - name: Run mandatory security scan
        run: python scripts/security_scan.py --archive node.zip
      - name: Verify security scanner integrity
        run: PYTHONPATH=. python tests/test_security_scan.py
      - name: Run Python tests
        run: PYTHONPATH=. python -m pytest tests -q -p no:cacheprovider --ignore=tests/test_security_scan.py --ignore=tests/e2e
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run JavaScript tests
        run: node --test tests/*.mjs
