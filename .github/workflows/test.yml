name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight test dependencies
        run: python -m pip install numpy Pillow
      - name: Run mandatory security scan
        run: python scripts/security_scan.py
      - name: Verify security scanner integrity
        run: PYTHONPATH=. python tests/test_security_scan.py
      - name: Run Python tests
        run: |
          for test_file in tests/*.py; do
            if [ "$test_file" != "tests/test_security_scan.py" ]; then
              PYTHONPATH=. python "$test_file"
            fi
          done
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run JavaScript tests
        run: node --test tests/*.mjs
